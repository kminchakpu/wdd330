<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Register</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@100;300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="../js/register.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider register-page">
      <h2>Create Your Account</h2>

      <div class="register-container">
        <!-- LEFT COLUMN -->

        <div class="register-left">
          <form id="registerForm" class="register-form" novalidate>
            <div id="registerMessages"></div>

            <!-- ======================
             PERSONAL INFORMATION
        ======================= -->

            <fieldset>
              <legend>Personal Information</legend>

              <label for="fname"> First Name </label>

              <input
                id="fname"
                name="fname"
                type="text"
                minlength="2"
                autocomplete="given-name"
                required
              />

              <small class="error-message"></small>

              <label for="lname"> Last Name </label>

              <input
                id="lname"
                name="lname"
                type="text"
                minlength="2"
                autocomplete="family-name"
                required
              />

              <small class="error-message"></small>

              <label for="email"> Email </label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />

              <small class="error-message"></small>

              <label for="phone"> Phone Number </label>

              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                pattern="[0-9+\-() ]{7,20}"
                required
              />

              <small class="error-message"></small>
            </fieldset>

            <!-- ======================
             ADDRESS
        ======================= -->

            <fieldset>
              <legend>Address</legend>

              <label for="street"> Street Address </label>

              <input
                id="street"
                name="street"
                type="text"
                minlength="5"
                autocomplete="street-address"
                required
              />

              <small class="error-message"></small>

              <label for="city"> City </label>

              <input
                id="city"
                name="city"
                type="text"
                autocomplete="address-level2"
                required
              />

              <small class="error-message"></small>

              <label for="state"> State </label>

              <input
                id="state"
                name="state"
                type="text"
                autocomplete="address-level1"
                required
              />

              <small class="error-message"></small>

              <label for="zip"> Zip Code </label>

              <input
                id="zip"
                name="zip"
                type="text"
                pattern="[0-9]{4,10}"
                autocomplete="postal-code"
                required
              />

              <small class="error-message"></small>
            </fieldset>

            <!-- ======================
             ACCOUNT
        ======================= -->

            <fieldset>
              <legend>Account</legend>

              <label for="password"> Password </label>

              <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />

              <small class="error-message"></small>

              <label for="confirmPassword"> Confirm Password </label>

              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />

              <small class="error-message"></small>
            </fieldset>

            <button id="registerButton" class="register-btn" type="submit">
              Create Account
            </button>
          </form>
        </div>

        <!-- RIGHT COLUMN -->

        <aside class="register-right">
          <h3>Why Register?</h3>

          <ul>
            <li>✔ Faster Checkout</li>
            <li>✔ Save Your Shipping Address</li>
            <li>✔ Exclusive Discounts</li>
            <li>✔ Early Access to New Products</li>
            <li>✔ Enter Our Monthly Giveaway</li>
          </ul>

          <a href="/" class="checkout-button"> Continue Shopping </a>
        </aside>
      </div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
