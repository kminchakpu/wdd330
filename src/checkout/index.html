<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="../css/style.css" />

  <link
    href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@100;300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <script type="module" src="../js/checkout.js"></script>
</head>

<body>

<header id="main-header" class="divider"></header>

<main class="divider checkout-page">

  <h2>Review & Place Your Order</h2>

  <div class="checkout-container">

    <!-- ==========================
         Checkout Form
    =========================== -->

    <form id="checkoutForm" class="checkout-form" method="get" action="success.html">

      <!-- Customer -->

      <fieldset>
        <legend>Customer Information</legend>

        <label for="fname">First Name</label>
        <input
          id="fname"
          type="text"
          name="fname"
          required
        >

        <label for="lname">Last Name</label>
        <input
          id="lname"
          type="text"
          name="lname"
          required
        >

        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          id="phone"
          type="tel"
          name="phone"
          required
        >
      </fieldset>

      <!-- Shipping -->

      <fieldset>
        <legend>Shipping Address</legend>

        <label for="street">Street Address</label>
        <input
          id="street"
          type="text"
          name="street"
          required
        >

        <label for="city">City</label>
        <input
          id="city"
          type="text"
          name="city"
          required
        >

        <label for="state">State</label>
        <input
          id="state"
          type="text"
          name="state"
          required
        >

        <label for="zip">Zip Code</label>
        <input
          id="zip"
          type="text"
          name="zip"
          required
        >
      </fieldset>

      <!-- Payment -->

      <fieldset>
        <legend>Payment Information</legend>

        <label for="cardNumber">Card Number</label>
        <input
          id="cardNumber"
          type="text"
          name="cardNumber"
          placeholder="1234123412341234"
          required
        >

        <label for="expiration">
          Expiration Date
        </label>

        <input
          id="expiration"
          type="text"
          name="expiration"
          placeholder="MM/YY"
          required
        >

        <label for="code">
          Security Code
        </label>

        <input
          id="code"
          type="text"
          name="code"
          maxlength="4"
          required
        >
      </fieldset>

      <button
        type="submit"
        class="checkout-btn"
        id="checkoutSubmit"
      >
        Place Order
      </button>

    </form>

    <!-- ==========================
         Order Summary
    =========================== -->

    <aside class="order-summary">

      <h3>Order Summary</h3>

      <p>
        Items
        <span id="itemCount">0</span>
      </p>

      <p>
        Subtotal
        <span id="subtotal">$0.00</span>
      </p>

      <p>
        Shipping
        <span id="shipping">$0.00</span>
      </p>

      <p>
        Tax
        <span id="tax">$0.00</span>
      </p>

      <hr>

      <p class="summary-total">
        <strong>Total</strong>
        <strong id="orderTotal">$0.00</strong>
      </p>

    </aside>

  </div>

</main>

<footer id="main-footer"></footer>

</body>
</html>
