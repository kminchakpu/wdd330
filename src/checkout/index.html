<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@100;300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="../js/checkout.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>
    <main class="divider checkout-page">
      <h2>Review &amp; Place Your Order</h2>
      <div class="checkout-container">
        <!-- LEFT COLUMN -->
        <div class="checkout-left">
          <form id="checkoutForm" class="checkout-form" novalidate>
            <div id="formMessages"></div>
            <!-- Customer Information -->
            <fieldset>
              <legend>Customer Information</legend>
              <label for="fname">First Name</label>
              <input
                id="fname"
                name="fname"
                type="text"
                minlength="2"
                autocomplete="given-name"
                required
              />

              <small class="error-message"></small>
              <label for="lname">Last Name</label>
              <input
                id="lname"
                name="lname"
                type="text"
                minlength="2"
                autocomplete="family-name"
                required
              />

              <small class="error-message"></small>
              <label for="email">Email</label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />

              <small class="error-message"></small>
              <label for="phone">Phone Number</label>

              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                required
              />

              <small class="error-message"></small>
            </fieldset>

            <!-- Shipping -->

            <fieldset>
              <legend>Shipping Address</legend>
              <label for="street">Street Address</label>
              <input
                id="street"
                name="street"
                type="text"
                minlength="5"
                autocomplete="street-address"
                required
              />

              <small class="error-message"></small>
              <label for="city">City</label>
              <input
                id="city"
                name="city"
                type="text"
                autocomplete="address-level2"
                required
              />

              <small class="error-message"></small>
              <label for="state">State</label>

              <input
                id="state"
                name="state"
                type="text"
                autocomplete="address-level1"
                required
              />

              <small class="error-message"></small>
              <label for="zip">Zip Code</label>

              <input
                id="zip"
                name="zip"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{4,10}"
                autocomplete="postal-code"
                required
              />

              <small class="error-message"></small>
            </fieldset>
            <!-- Payment -->

            <fieldset>
              <legend>Payment Information</legend>

              <label for="cardNumber"> Card Number </label>

              <input
                id="cardNumber"
                name="cardNumber"
                type="text"
                maxlength="16"
                inputmode="numeric"
                pattern="[0-9]{16}"
                autocomplete="cc-number"
                placeholder="1234123412341234"
                required
              />

              <small class="error-message"></small>
              <label for="expiration"> Expiration Date </label>

              <input
                id="expiration"
                name="expiration"
                type="text"
                pattern="(0[1-9]|1[0-2])/[0-9]{2}"
                placeholder="MM/YY"
                autocomplete="cc-exp"
                required
              />
              <small class="error-message"></small>

              <label for="code"> Security Code </label>

              <input
                id="code"
                name="code"
                type="text"
                maxlength="4"
                inputmode="numeric"
                pattern="[0-9]{3,4}"
                autocomplete="cc-csc"
                required
              />

              <small class="error-message"></small>
            </fieldset>

            <button id="checkoutButton" class="checkout-btn" type="submit">
              Place Order
            </button>
          </form>
        </div>

        <!-- RIGHT COLUMN -->

        <aside class="order-summary">
          <h3>Order Summary</h3>

          <p>
            Items
            <span id="itemCount">0</span>
          </p>

          <p>
            Subtotal
            <span id="subtotal">$0.00</span>
          </p>

          <p>
            Shipping
            <span id="shipping">$0.00</span>
          </p>

          <p>
            Tax
            <span id="tax">$0.00</span>
          </p>

          <hr />

          <p class="summary-total">
            <strong>Total</strong>
            <strong id="orderTotal">$0.00</strong>
          </p>
        </aside>
      </div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
