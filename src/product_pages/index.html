<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Make and Name</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <div id="breadcrumb"></div>

    <main class="divider">

      <section class="product-detail">

        <!-- Brand -->
        <h2>Brand Name</h2>

        <!-- Product Name -->
        <h3 class="divider">Product Name</h3>

        <!-- Product Image -->
        <div class="product-image-wrapper">

          <img
            id="productImage"
            src="../images/camping-products.jpg"
            alt="Sleep Outside Camping Products"
            class="divider"
          />

          <!-- Discount Badge -->
          <span
            id="discountBadge"
            class="discount-badge"
          ></span>

        </div>

        <!-- Original Price -->
        <p
          id="retailPrice"
          class="product-detail__retail"
        ></p>

        <!-- Sale Price -->
        <p
          id="productPrice"
          class="product-detail__price"
        ></p>

        <!-- ==========================
             PRODUCT COLORS
        =========================== -->

        <div class="product-colors">

          <h4>Choose a Color</h4>

          <div
            id="colorSwatches"
            class="color-swatches"
          ></div>

          <p class="selected-color">
            Selected:
            <strong id="productColor"></strong>
          </p>

        </div>

        <!-- Product Description -->
        <p
          id="productDesc"
          class="product__description"
        >
          Description
        </p>

        <!-- Add to Cart -->
        <div class="product-detail__add">

          <button
            type="button"
            id="addToCart"
            data-id="productId"
          >
            Add to Cart
          </button>
        </div>

        <!-- CUSTOMER COMMENTS-->

          <section class="product-comments">

            <h3>
              Customer Reviews
              (<span id="commentCount">0</span>)
            </h3>

            <!-- Comment Form -->

            <form
              id="commentForm"
              class="comment-form"
              novalidate
            >

              <label for="commentName">
                Your Name
              </label>

              <input
                id="commentName"
                type="text"
                required
                maxlength="40"
                placeholder="John Smith"
              >

              <label for="commentRating">
                Rating
              </label>

              <select
                id="commentRating"
                required
              >
                <option value="">Choose Rating</option>
                <option value="5">★★★★★ Excellent</option>
                <option value="4">★★★★☆ Very Good</option>
                <option value="3">★★★☆☆ Good</option>
                <option value="2">★★☆☆☆ Fair</option>
                <option value="1">★☆☆☆☆ Poor</option>
              </select>

              <label for="commentText">
                Comment
              </label>

              <textarea
                id="commentText"
                rows="5"
                maxlength="500"
                placeholder="Share your experience with this product..."
                required
              ></textarea>

              <button
                type="submit"
                id="commentButton"
              >
                Post Review
              </button>

            </form>
            <!-- Success / Error Messages -->
            <div id="commentMessage"></div>
            <!-- Display Comments -->
            <div id="commentsList"></div>

          </section>
      </section>

    </main>

    <footer id="main-footer"></footer>

  </body>
</html>
