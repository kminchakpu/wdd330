<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="../js/product-listing.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <div id="breadcrumb"></div>

    <div class="filters">

  <label>
    <input type="checkbox" id="saleFilter">
    On Sale Only
  </label>

  <label for="priceFilter">Maximum Price</label>

  <select id="priceFilter">
    <option value="">All Prices</option>
    <option value="50">Under $50</option>
    <option value="100">Under $100</option>
    <option value="150">Under $150</option>
    <option value="200">Under $200</option>
    <option value="300">Under $300</option>
</select>

</div>

    <div class="product-controls">
  <label for="sortProducts">Sort By:</label>

  <select id="sortProducts">
    <option value="default">Default</option>
    <option value="name-asc">Name (A-Z)</option>
    <option value="name-desc">Name (Z-A)</option>
    <option value="price-asc">Price (Low to High)</option>
    <option value="price-desc">Price (High to Low)</option>
  </select>
</div>
    <main class="divider">
      <section class="products">
        <h2 id="categoryTitle">Top Products</h2>
        <ul class="product-list"></ul>
      </section>

      <section class="products">
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
